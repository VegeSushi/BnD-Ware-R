name: Build BnD-Ware

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # sdl2-sys bundles SDL2's own CMakeLists.txt, which declares a
  # cmake_minimum_required() below 3.5. Newer CMake (4.x, now on
  # windows-latest/ubuntu-latest) refuses to configure such projects
  # unless told to fall back to the old policy set.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-windows:
    name: Windows (build.bat + installer)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # SDL2 is built from source ("bundled" + "static-link"), which needs cmake.
      # cmake is preinstalled on the windows-latest runner image, but make sure.
      - name: Ensure cmake is available
        run: cmake --version

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # build.bat handles: fetch assets/minigames -> cargo build --release
      # -> ISCC setup.iss. It clones VegeSushi/BnD-Ware itself for assets,
      # so no extra checkout step is needed for that part.
      - name: Run build.bat
        shell: cmd
        run: build.bat

      - name: Upload game binaries
        uses: actions/upload-artifact@v4
        with:
          name: bnd-ware-windows-binaries
          path: |
            target/release/bnd_game.exe
            target/release/bnd_mod_manager.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bnd-ware-windows-installer
          path: Output/BnDWare_Installer.exe

  build-linux:
    name: Linux (build.sh + AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # System packages needed to build/run:
      #  - cmake: builds bundled SDL2 from source
      #  - libasound2-dev: SDL2 audio backend (ALSA)
      #  - libx11-dev/libxext-dev/libxrandr-dev/libxcursor-dev/libxi-dev/
      #    libxinerama-dev/libxkbcommon-dev/libwayland-dev: windowing (SDL2 + eframe/winit)
      #  - libgl1-mesa-dev/libegl1-mesa-dev: OpenGL for eframe/egui rendering
      #  - fuse: required to run AppImages (build itself doesn't need it, but
      #    appimagetool benefits from it; we use --appimage-extract-and-run instead)
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Make build.sh executable
        run: chmod +x build.sh fetch.sh

      - name: Run build.sh
        run: ./build.sh

      - name: Upload game binaries
        uses: actions/upload-artifact@v4
        with:
          name: bnd-ware-linux-binaries
          path: |
            target/release/bnd_game
            target/release/bnd_mod_manager

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: bnd-ware-linux-appimage
          path: Output/BnDWare-x86_64.AppImage

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten + give each file a stable, unambiguous release name.
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/bnd-ware-windows-installer/BnDWare_Installer.exe release/BnDWare_Installer.exe
          cp artifacts/bnd-ware-windows-binaries/bnd_game.exe release/bnd_game-windows.exe
          cp artifacts/bnd-ware-windows-binaries/bnd_mod_manager.exe release/bnd_mod_manager-windows.exe
          cp artifacts/bnd-ware-linux-appimage/BnDWare-x86_64.AppImage release/BnDWare-x86_64.AppImage
          cp artifacts/bnd-ware-linux-binaries/bnd_game release/bnd_game-linux
          cp artifacts/bnd-ware-linux-binaries/bnd_mod_manager release/bnd_mod_manager-linux

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
